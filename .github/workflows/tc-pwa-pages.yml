name: Deploy TC PWA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "iphone-tc/**"
      - "index.html"
      - "assets/**"
      - "css/**"
      - "js/**"
      - "vendor/**"
      - "cinemas/TC/**"
      - ".github/workflows/tc-pwa-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tc-pwa-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iphone-tc

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v6

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iphone-tc/package-lock.json

      - name: 安裝相依套件
        run: npm ci --no-audit --no-fund

      - name: 產生 TC PWA
        run: npm run build:web

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 GitHub Pages 產物
        uses: actions/upload-pages-artifact@v4
        with:
          path: iphone-tc/www

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 部署 TC PWA
        id: deployment
        uses: actions/deploy-pages@v4
